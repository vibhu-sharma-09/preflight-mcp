[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "preflight-mcp"
version = "0.1.0"
description = "Email campaign QA tools for AI agents, served over the Model Context Protocol (MCP)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vibhu Sharma" }]
keywords = ["mcp", "email-marketing", "marketing-automation", "ai-agents", "sfmc", "qa"]
dependencies = [
  "mcp>=2.3,<3",
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
preflight-mcp = "preflight.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/preflight"]

[tool.pytest.ini_options]
pythonpath = ["src"]
